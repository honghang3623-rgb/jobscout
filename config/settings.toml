model = "your-model-id"      # 评分用的模型，需设置环境变量 ANTHROPIC_API_KEY
llm_top_n = 25                    # 每次只对关键词初筛后最靠前的 N 个岗位调用模型
llm_min_heuristic = 45
fuzzy_cutoff = 0.9                # 公司名模糊匹配阈值，匹配结果会显示出来供人工核对

